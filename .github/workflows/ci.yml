name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Code Hygiene & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"

      - name: Terraform AWS Init (Backendless)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform AWS Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform AWS Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Cloudflare Init (Backendless)
        run: terraform -chdir=terraform-cloudflare init -backend=false

      - name: Terraform Cloudflare Format Check
        run: terraform -chdir=terraform-cloudflare fmt -check

      - name: Terraform Cloudflare Validate
        run: terraform -chdir=terraform-cloudflare validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: "v0.55.1"

      - name: TFLint Init
        run: tflint --init

      - name: TFLint AWS Infrastructure
        run: tflint --chdir=terraform

      - name: TFLint Cloudflare Infrastructure
        run: tflint --chdir=terraform-cloudflare

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies & Linters
        run: pip install ansible yamllint==1.38.0 ansible-lint==26.8.0 -r requirements-docs.txt

      - name: Run Yamllint
        run: yamllint -c .yamllint.yml .github/workflows ansible app/compose.yaml .ansible-lint mkdocs.yml

      - name: Install Ansible Roles & Collections
        run: |
          ansible-galaxy role install -r ansible/requirements.yml -p ansible/roles
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible-Lint
        run: ansible-lint

      - name: Ansible Playbook Syntax Check (SSH Baseline)
        run: ansible-playbook --syntax-check -i ansible/inventory.ini.example ansible/playbook.yml

      - name: Ansible Playbook Syntax Check (SSM Transport)
        run: ansible-playbook --syntax-check -i ansible/inventory-ssm.ini.example ansible/playbook.yml

      - name: Strict Documentation Build Check
        run: |
          mkdocs build --strict
          test -f site/CNAME


  app-build:
    name: Frontend App Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run preflight test
        run: npm run test

      - name: Build production bundle
        run: npm run build

  platform-tests:
    name: Platform Lifecycle Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run platform lifecycle unit tests
        run: python3 -m unittest discover -s tests -v

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 fetches the full commit history. Gitleaks defaults to
      # scanning only what is checked out, so without this a secret introduced
      # in an earlier commit and later deleted would go undetected.
      #
      # Justification: this repository's history is small, so a full-history
      # scan costs seconds. Growth path — if this job exceeds roughly 2 minutes,
      # switch to a bounded range scan via GITLEAKS_ENABLE_COMMENTS/--log-opts
      # (for example `--log-opts=${{ github.event.pull_request.base.sha }}..HEAD`)
      # rather than dropping history coverage entirely.
      - name: Check out repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GITLEAKS_LICENSE is required for organization-owned repositories only.
      # This repository is personal-account owned, so GITHUB_TOKEN suffices.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln-scan:
    name: Vulnerability & IaC Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Dependency/filesystem scan of the application tree. Blocking at HIGH+.
      - name: Trivy filesystem scan (app)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Build the image locally so it can be scanned BEFORE any registry push.
      # ECR scan-on-push only reports findings after the artifact is already
      # pullable; this is the actual gate. No registry credentials are needed.
      - name: Build application image for scanning
        run: docker build -t devops-bootcamp-app:ci-scan app

      - name: Trivy image scan (pre-push gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devops-bootcamp-app:ci-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Terraform misconfiguration scan across both roots. Advisory for now:
      # continue-on-error keeps unassessed noise from blocking delivery. Promote
      # to blocking after roughly two weeks of observed findings.
      - name: Trivy IaC config scan (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
