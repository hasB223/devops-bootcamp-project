name: Platform Lifecycle Automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Platform lifecycle action to execute'
        type: choice
        options:
          - status
          - health
          - park
          - unpark
        default: status
      dry_run:
        description: 'Dry-run preview mode (simulate without making live changes)'
        type: boolean
        default: false
      allow_unrelated_changes:
        description: 'Allow unpark plan to apply resources outside unpark allowlist'
        type: boolean
        default: false
  schedule:
    # Nightly auto-park scheduled at 00:00 SGT (16:00 UTC)
    - cron: '0 16 * * *'

permissions:
  id-token: write
  contents: read

jobs:
  lifecycle:
    name: Platform Lifecycle
    runs-on: ubuntu-latest
    # Safety gate: If scheduled run, execute only when AUTO_PARK_ENABLED is 'true'
    if: github.event_name != 'schedule' || vars.AUTO_PARK_ENABLED == 'true'
    steps:
      - name: Enforce main-only lifecycle operations
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Platform lifecycle operations are main-only; use a pull request to main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve Action & Safety Gates
        id: resolver
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "action=park" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "allow_unrelated=false" >> "$GITHUB_OUTPUT"
            echo "role_arn=${{ vars.AWS_ROLE_LIFECYCLE }}" >> "$GITHUB_OUTPUT"
            echo "==> Triggered by schedule. Resolved ACTION strictly forced to: park."
          else
            ACTION="${{ github.event.inputs.action }}"
            echo "action=$ACTION" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "allow_unrelated=${{ github.event.inputs.allow_unrelated_changes }}" >> "$GITHUB_OUTPUT"
            case "$ACTION" in
              park|unpark)
                echo "role_arn=${{ vars.AWS_ROLE_LIFECYCLE }}" >> "$GITHUB_OUTPUT"
                ;;
              status)
                echo "role_arn=${{ vars.AWS_ROLE_READONLY }}" >> "$GITHUB_OUTPUT"
                ;;
              health)
                echo "role_arn=" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::Unsupported lifecycle action: $ACTION"
                exit 1
                ;;
            esac
            echo "==> Triggered manually. Resolved ACTION: $ACTION."
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.resolver.outputs.action != 'health'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.resolver.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform (only for park and unpark)
        if: steps.resolver.outputs.action == 'park' || steps.resolver.outputs.action == 'unpark'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Initialize Terraform Backend (only for park and unpark)
        if: steps.resolver.outputs.action == 'park' || steps.resolver.outputs.action == 'unpark'
        working-directory: terraform
        run: terraform init -backend=true

      - name: Execute Lifecycle Engine
        id: run-engine
        env:
          RESOLVED_ACTION: ${{ steps.resolver.outputs.action }}
          DRY_RUN: ${{ steps.resolver.outputs.dry_run }}
          ALLOW_UNRELATED: ${{ steps.resolver.outputs.allow_unrelated }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PYTHONUNBUFFERED: "1"
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "$ALLOW_UNRELATED" = "true" ]; then
            FLAGS="$FLAGS --allow-unrelated-changes"
          fi

          echo "==> Executing: python3 scripts/platform.py $RESOLVED_ACTION $FLAGS"
          python3 scripts/platform.py "$RESOLVED_ACTION" $FLAGS
