---
# ==============================================================================
# Global Variables for DevOps Bootcamp Capstone Ansible Automation
# ==============================================================================

# AWS Configuration
aws_region: ap-southeast-1
aws_account_id: "164824552037"
ecr_registry: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com"
ecr_repository_name: "devops-bootcamp/final-project-hasb"
app_image_tag: "latest"
app_image: "{{ ecr_registry }}/{{ ecr_repository_name }}:{{ app_image_tag }}"

# Application Deployment Configuration
app_container_name: "devops-web-app"
app_host_port: 80
app_container_port: 80

# geerlingguy.docker Role Configuration
docker_edition: "ce"
docker_packages_state: "present"
docker_service_state: "started"
docker_service_enabled: true
docker_install_compose_plugin: true
docker_restart_handler_state: "restarted"
docker_users:
  - ubuntu
  - ssm-user

# ==============================================================================
# Phase 4: Monitoring & Observability Stack Configuration
# ==============================================================================
monitoring_stack_dir: "/opt/monitoring"

# Node Exporter (Web Server: 10.0.0.5)
node_exporter_host: "10.0.0.5"
node_exporter_port: 9100
node_exporter_image: "prom/node-exporter:v1.8.2"

# Prometheus (Monitoring Server: 10.0.0.136)
prometheus_port: 9090
prometheus_image: "prom/prometheus:v2.53.0"
prometheus_scrape_interval: "15s"

# Grafana (Monitoring Server: 10.0.0.136)
grafana_port: 3000
grafana_image: "grafana/grafana:11.1.0"
grafana_admin_user: "admin"

# Sensitive Credentials Direction:
# The Grafana admin password is never hardcoded. It is resolved dynamically from
# the GRAFANA_ADMIN_PASSWORD environment variable (populated via Infisical CLI)
# or an ignored local vars file. A secure vault placeholder is provided as fallback.
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('VAULT_MANAGED_PLACEHOLDER_INJECT_VIA_INFISICAL', true) }}"

# ==============================================================================
# Phase 5: Domain & Cloudflare Tunnel Configuration
# ==============================================================================
domain_name: "hasb.dev"
web_subdomain: "web"
monitoring_subdomain: "monitoring"
web_fqdn: "{{ web_subdomain }}.{{ domain_name }}"
monitoring_fqdn: "{{ monitoring_subdomain }}.{{ domain_name }}"

# Cloudflare Tunnel Connector (Monitoring Server: 10.0.0.136)
cloudflared_image: "cloudflare/cloudflared:2024.8.3"
cloudflared_container_name: "cloudflared"

# Sensitive Credentials Direction:
# The Cloudflare Tunnel token is never hardcoded. It is resolved dynamically from
# the CLOUDFLARE_TUNNEL_TOKEN environment variable (injected via Infisical CLI
# path /ansible/CLOUDFLARE_TUNNEL_TOKEN or temporary local shell fallback).
# Play 4 enforces a fail-fast assertion before any container is launched.
cloudflare_tunnel_token: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') | default('VAULT_MANAGED_PLACEHOLDER_INJECT_VIA_INFISICAL', true) }}"
