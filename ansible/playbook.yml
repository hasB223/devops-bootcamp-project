---
# ==============================================================================
# DevOps Bootcamp Capstone - Master Configuration Playbook
#
# Target Nodes:
#   - web-server (10.0.0.5): Docker + Web App container + node_exporter
#   - monitoring-server (10.0.0.136): Docker + Prometheus & Grafana stack
#
# Execution Host:
#   - ansible-controller (10.0.0.135) via VPC private network
# ==============================================================================

- name: Play 1 - Base Environment & Docker Setup on All Target Nodes
  hosts: targets
  become: true
  gather_facts: true
  vars_files:
    - group_vars/all.yml

  pre_tasks:
    - name: Update apt cache if older than 1 hour
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-pip
          - python3-docker
          - unzip
        state: present

    - name: Verify or install AWS CLI v2 for IAM ECR authentication
      block:
        - name: Check AWS CLI binary existence
          ansible.builtin.command:
            cmd: "which aws"
          register: aws_cli_check
          changed_when: false
          failed_when: false

        - name: Download AWS CLI v2 bundle if missing
          ansible.builtin.get_url:
            url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            dest: "/tmp/awscliv2.zip"
            mode: "0644"
          when: aws_cli_check.rc != 0

        - name: Unarchive AWS CLI bundle
          ansible.builtin.unarchive:
            src: "/tmp/awscliv2.zip"
            dest: "/tmp"
            remote_src: true
          when: aws_cli_check.rc != 0

        - name: Run AWS CLI installer
          ansible.builtin.command:
            cmd: "/tmp/aws/install"
          when: aws_cli_check.rc != 0

  roles:
    - role: geerlingguy.docker

  post_tasks:
    - name: Ensure Docker service is enabled and started
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Ensure ssm-user is member of docker group
      ansible.builtin.user:
        name: ssm-user
        groups: docker
        append: true
      ignore_errors: true


- name: Play 2 - Deploy Application Container & Node Exporter on Web Server
  hosts: web
  become: true
  gather_facts: false
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Retrieve ECR authentication token via EC2 IAM Instance Profile
      ansible.builtin.command:
        cmd: "aws ecr get-login-password --region {{ aws_region }}"
      register: ecr_token
      changed_when: false
      no_log: true

    - name: Authenticate Docker daemon to AWS Private ECR
      community.docker.docker_login:
        registry_url: "{{ ecr_registry }}"
        username: AWS
        password: "{{ ecr_token.stdout }}"
        reauthorize: true
      changed_when: false

    - name: Pull application image from private ECR
      community.docker.docker_image:
        name: "{{ app_image }}"
        source: pull
        force_source: false
      register: pull_image_result

    - name: Deploy application container on port 80
      community.docker.docker_container:
        name: "{{ app_container_name }}"
        image: "{{ app_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ app_host_port }}:{{ app_container_port }}"
        healthcheck:
          test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
          interval: 10s
          timeout: 5s
          retries: 3
          start_period: 5s

    - name: Verify Web application endpoint responds with HTTP 200
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_host_port }}"
        method: GET
        status_code: 200
      register: app_http_response
      until: app_http_response.status == 200
      retries: 10
      delay: 3
      changed_when: false

    - name: Deploy node_exporter container on web server
      community.docker.docker_container:
        name: node_exporter
        image: "{{ node_exporter_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ node_exporter_port }}:9100"
        volumes:
          - /proc:/host/proc:ro
          - /sys:/host/sys:ro
          - /:/rootfs:ro
        command:
          - '--path.procfs=/host/proc'
          - '--path.sysfs=/host/sys'
          - '--path.rootfs=/rootfs'

    - name: Verify node_exporter endpoint responds with HTTP 200
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
        method: GET
        status_code: 200
      register: node_exporter_http
      until: node_exporter_http.status == 200
      retries: 5
      delay: 2
      changed_when: false


- name: Play 3 - Deploy Prometheus & Grafana Monitoring Stack
  hosts: monitoring
  become: true
  gather_facts: false
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Verify Docker daemon operational status
      ansible.builtin.command:
        cmd: "docker info"
      register: docker_info
      changed_when: false

    - name: Ensure monitoring stack directory hierarchy exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - "{{ monitoring_stack_dir }}"
        - "{{ monitoring_stack_dir }}/grafana"
        - "{{ monitoring_stack_dir }}/grafana/provisioning"
        - "{{ monitoring_stack_dir }}/grafana/provisioning/datasources"
        - "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards"
        - "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards/definitions"

    - name: Deploy Prometheus scrape configuration
      ansible.builtin.template:
        src: templates/monitoring/prometheus.yaml.j2
        dest: "{{ monitoring_stack_dir }}/prometheus.yaml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      register: prometheus_cfg

    - name: Deploy Grafana datasource provisioning
      ansible.builtin.copy:
        src: files/monitoring/grafana/provisioning/datasources/prometheus.yaml
        dest: "{{ monitoring_stack_dir }}/grafana/provisioning/datasources/prometheus.yaml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Deploy Grafana dashboard provider
      ansible.builtin.copy:
        src: files/monitoring/grafana/provisioning/dashboards/dashboards.yaml
        dest: "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards/dashboards.yaml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Deploy Grafana Node Exporter dashboard definition
      ansible.builtin.copy:
        src: files/monitoring/grafana/provisioning/dashboards/definitions/node-exporter.json
        dest: "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards/definitions/node-exporter.json"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Deploy Docker Compose configuration for monitoring stack
      ansible.builtin.template:
        src: templates/monitoring/compose.yaml.j2
        dest: "{{ monitoring_stack_dir }}/compose.yaml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      register: compose_cfg

    - name: Launch monitoring container stack
      ansible.builtin.command:
        cmd: "docker compose up -d"
        chdir: "{{ monitoring_stack_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Creating' in compose_up.stdout or 'Recreating' in compose_up.stdout"

    - name: Verify Prometheus health endpoint responds with HTTP 200
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/-/healthy"
        method: GET
        status_code: 200
      register: prometheus_health
      until: prometheus_health.status == 200
      retries: 10
      delay: 3
      changed_when: false

    - name: Verify Prometheus target status API responds with HTTP 200
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/targets"
        method: GET
        status_code: 200
      register: prometheus_targets
      until: prometheus_targets.status == 200
      retries: 10
      delay: 3
      changed_when: false

    - name: Verify Grafana operational health endpoint responds with HTTP 200
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/health"
        method: GET
        status_code: 200
      register: grafana_health
      until: grafana_health.status == 200
      retries: 10
      delay: 3
      changed_when: false
