services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-bootcamp-app:local
    container_name: devops-web-app
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
